version: '3.8'

services:
  api-gateway:
    image: nginx:1.25-alpine
    container_name: quickbite-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-service
    networks:
      - quickbite-net

  backend-service:
    image: thinhbanto/quickbite-backend:1.0.0
    container_name: quickbite-backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/quickbite_uat
      SPRING_DATASOURCE_USERNAME: quickbite
      SPRING_DATASOURCE_PASSWORD: UatSecretPassword123
      SPRING_DATA_REDIS_HOST: redis-cache
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_started
    networks:
      - quickbite-net

  postgres-db:
    image: postgres:15-alpine
    container_name: quickbite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quickbite_uat
      POSTGRES_USER: quickbite
      POSTGRES_PASSWORD: UatSecretPassword123
    volumes:
      - pg_uat_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickbite -d quickbite_uat"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - quickbite-net

  redis-cache:
    image: redis:7-alpine
    container_name: quickbite-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_uat_data:/data
    networks:
      - quickbite-net

volumes:
  pg_uat_data:
  redis_uat_data:

networks:
  quickbite-net:
    driver: bridge
